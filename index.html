<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSINA COMMUNITY 10</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6A3D">
<style>
:root{--green:#0B6A3D;--yellow:#FFC72C;--cream:#FFFBEB;--dark:#0B2E1F}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--cream);color:var(--dark)}
header{background:var(--green);color:white;padding:14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header.brand{display:flex;align-items:center;gap:10px}
header img{width:42px;height:42px;border-radius:10px;background:white;object-fit:cover}
.btn{border:none;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.btn-yellow{background:var(--yellow);color:var(--dark)}
.btn-green{background:var(--green);color:white}
.btn-outline{background:white;border:2px solid var(--green);color:var(--green)}
.card{background:white;margin:12px;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid #EFE5C0}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 0 14px;border-top:1px solid #EADFAA;z-index:20}
.nav button{border:none;background:none;font-size:11px;font-weight:700;color:#8A7A3A;cursor:pointer;padding:6px 10px;border-radius:10px}
.nav button.active{background:var(--green);color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input{width:100%;padding:12px;border-radius:10px;border:2px solid #E8DD9C;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modalBox{background:white;width:100%;max-width:420px;border-radius:18px;padding:18px}
</style>
</head>
<body>
<header>
<div class="brand">
<img src="logo.png" alt="M10">
<div><h1 style="font-size:16px">MUSINA COMMUNITY 10</h1><div style="font-size:10px">10 STOKVEL • MUSINA</div></div>
</div>
<button onclick="openProfile()" style="background:#FFC72C;border:none;width:38px;height:38px;border-radius:50%;font-weight:900;cursor:pointer">P</button>
</header>

<div id="homePage">
<div class="card" style="background:#0B6A3D;color:white">
<h2 style="margin:10px 0">R<span id="totalPot">0</span> Total Pot</h2>
<p style="font-size:13px">10 Members • R500/month each</p>
<div class="grid2" style="margin-top:14px">
<button class="btn btn-yellow" onclick="openPay()">PAY NOW</button>
<button class="btn btn-outline" onclick="showMembers()">MEMBERS</button>
</div>
</div>

<div class="card">
<h3>Quick Pay - Super Simple</h3>
<input id="payAmount" class="input" type="number" placeholder="e.g. 500">
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="doPay()">PAY NOW</button>
</div>

<div class="card">
<h3>Recent Activity</h3>
<div id="activity" style="margin-top:10px;font-size:13px">No payments yet. Be first!</div>
</div>
</div>

<div id="membersPage" style="display:none">
<div class="card"><h3>10 Members</h3><div id="membersList" style="margin-top:10px"></div></div>
</div>

<div class="nav">
<button id="navHome" class="active" onclick="goHome()">🏠<br>HOME</button>
<button id="navMembers" onclick="goMembers()">👥<br>MEMBERS</button>
<button onclick="openProfile()">👤<br>PROFILE</button>
<button onclick="openPay()">💳<br>PAY</button>
</div>

<div id="profileModal" class="modal" onclick="if(event.target==this)closeProfile()">
<div class="modalBox">
<h3>My Profile</h3>
<input id="pName" class="input" placeholder="Your name">
<input id="pPhone" class="input" style="margin-top:8px" placeholder="07...">
<div class="grid2" style="margin-top:14px">
<button class="btn btn-outline" onclick="closeProfile()">CANCEL</button>
<button class="btn btn-green" onclick="saveProfile()">SAVE</button>
</div>
</div>
</div>

<div id="payModal" class="modal" onclick="if(event.target==this)closePay()">
<div class="modalBox">
<h3>Pay Stokvel</h3>
<input id="mPayAmount" class="input" value="500">
<div class="grid2" style="margin-top:14px">
<button class="btn btn-outline" onclick="closePay()">CANCEL</button>
<button class="btn btn-yellow" onclick="confirmPay()">I PAID</button>
</div>
</div>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let members=JSON.parse(localStorage.getItem('m10_members')||'[]');
if(members.length==0){members=[{name:'Member 1',paid:0},{name:'Member 2',paid:0},{name:'Member 3',paid:0},{name:'Member 4',paid:0},{name:'Member 5',paid:0},{name:'Member 6',paid:0},{name:'Member 7',paid:0},{name:'Member 8',paid:0},{name:'Member 9',paid:0},{name:'Admin',paid:0}];localStorage.setItem('m10_members',JSON.stringify(members))}
let total=parseInt(localStorage.getItem('m10_total')||'0');
let activity=JSON.parse(localStorage.getItem('m10_act')||'[]');
function render(){document.getElementById('totalPot').innerText=total;document.getElementById('membersList').innerHTML=members.map((m,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0E6B8"><span>${m.name} - R${m.paid}</span><button class="btn btn-yellow" style="padding:6px 10px;font-size:12px" onclick="payFor(${i})">PAY</button></div>`).join('');document.getElementById('activity').innerHTML=activity.length?activity.map(a=>`<div>• ${a}</div>`).join(''):'No payments yet.'}
render();
function goHome(){document.getElementById('homePage').style.display='block';document.getElementById('membersPage').style.display='none';document.getElementById('navHome').classList.add('active');document.getElementById('navMembers').classList.remove('active');}
function goMembers(){document.getElementById('homePage').style.display='none';document.getElementById('membersPage').style.display='block';document.getElementById('navHome').classList.remove('active');document.getElementById('navMembers').classList.add('active');render();}
function showMembers(){goMembers();}
function openProfile(){document.getElementById('profileModal').classList.add('show');}
function closeProfile(){document.getElementById('profileModal').classList.remove('show');}
function saveProfile(){localStorage.setItem('m10_myName',document.getElementById('pName').value);localStorage.setItem('m10_myPhone',document.getElementById('pPhone').value);closeProfile();alert('Profile saved boss!');}
function openPay(){document.getElementById('payModal').classList.add('show');}
function closePay(){document.getElementById('payModal').classList.remove('show');}
function doPay(){let amt=parseInt(document.getElementById('payAmount').value||'500');total+=amt;activity.unshift(`You paid R${amt}`);localStorage.setItem('m10_total',total);localStorage.setItem('m10_act',JSON.stringify(activity));render();alert('Paid R'+amt+' boss!');}
function confirmPay(){let amt=parseInt(document.getElementById('mPayAmount').value||'500');total+=amt;activity.unshift(`Paid R${amt}`);localStorage.setItem('m10_total',total);localStorage.setItem('m10_act',JSON.stringify(activity));render();closePay();alert('Thank you boss! R'+amt+' added!');}
function payFor(i){let amt=500;members[i].paid+=amt;total+=amt;activity.unshift(`${members[i].name} paid R${amt}`);localStorage.setItem('m10_members',JSON.stringify(members));localStorage.setItem('m10_total',total);localStorage.setItem('m10_act',JSON.stringify(activity));render();alert(members[i].name+' paid R'+amt);}
</script>
</body>
</html>
